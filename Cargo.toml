[workspace]
resolver = "2"
members = [
    "pg",
    "pg/crates/kalam-pg-common",
    "pg/crates/kalam-pg-api",
    "pg/crates/kalam-pg-fdw",
    "pg/crates/kalam-pg-types",
    "pg/crates/kalam-pg-client",
    "backend/crates/kalamdb-macros",
    "backend/crates/kalamdb-commons",
    "backend/crates/kalamdb-serialization",
    "backend/crates/kalamdb-row-filter",
    "backend/crates/kalamdb-configs",
    "backend/crates/kalamdb-filestore",
    "backend/crates/kalamdb-transfer",
    "backend/crates/kalamdb-flush",
    "backend/crates/kalamdb-streams",
    "backend/crates/kalamdb-sharding",
    "backend/crates/kalamdb-session",
    "backend/crates/kalamdb-session-datafusion",
    "backend/crates/kalamdb-transactions",
    "backend/crates/kalamdb-backend",
    "backend/crates/kalamdb-datafusion-sources",
    "backend/crates/kalamdb-system",
    "backend/crates/kalamdb-tables",
    "backend/crates/kalamdb-rls",
    "backend/crates/kalamdb-dba",
    "backend/crates/kalamdb-observability",
    "backend/crates/kalamdb-vector",
    "backend/crates/kalamdb-core",
    "backend/crates/kalamdb-live",
    "backend/crates/kalamdb-handlers",
    "backend/crates/kalamdb-handlers/crates/support",
    "backend/crates/kalamdb-handlers/crates/admin",
    "backend/crates/kalamdb-handlers/crates/ddl",
    "backend/crates/kalamdb-handlers/crates/stream",
    "backend/crates/kalamdb-handlers/crates/user",
    "backend/crates/kalamdb-jobs",
    "backend/crates/kalamdb-plan-cache",
    "backend/crates/kalamdb-publisher",
    "backend/crates/kalamdb-dialect",
    "backend/crates/kalamdb-functions",
    "backend/crates/kalamdb-store",
    "backend/crates/kalamdb-api",
    "backend/crates/kalamdb-auth",
    "backend/crates/kalamdb-raft",
    "backend/crates/kalamdb-views",
    "backend/crates/kalamdb-pg",
    "backend/crates/kalamdb-postgres-wire",
    "backend/crates/kalamdb-server-auth",
    "backend",
    "cli",
    "cli/crates/kalam-schema-diff",
    "cli/kalam-cli-e2e",
    "link/link-common",
    "link/sdks/rust",
    "link/sdks/rust/examples/quickstart",
    "link/sdks/rust-e2e",
    "link/kalam-link-wasm",
    "link/kalam-consumer-wasm",
    "link/kalam-link-dart",
    "link/sdks/python",
]
exclude = ["benchv2"]

[workspace.package]
version = "0.6.0-rc.0"
edition = "2021"
rust-version = "1.94"
authors = ["KalamDB Team"]
license = "Apache-2.0"
repository = "https://github.com/kalamdb/KalamDB"

# Shared dependencies for all crates
[workspace.dependencies]
# Serialization
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
handlebars = "6.4.4"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"

# Logging
log = "0.4.34"

# Async runtime
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "net", "signal", "parking_lot"] }
tokio-netem = "0.1.1"
tokio-stream = { version = "0.1.19", features = ["net"] }

# HTTP client (with HTTP/2 support) - using rustls-tls for cross-compilation compatibility
# Note: native-tls requires OpenSSL which is difficult to cross-compile for aarch64
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "multipart", "stream", "form"] }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
url = "2.5.8"

# WebSocket
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# Security floor pins for vulnerable transitive TLS/QUIC crates.
aws-lc-rs = { version = "1.18.1", default-features = false }
rustls = { version = "0.23.43", default-features = false }
quinn-proto = { version = "0.11.17", default-features = false }
rustls-webpki = { version = "0.103.15", default-features = false }

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Storage
rocksdb = { version = "0.25.0", default-features = false, features = ["snappy", "lz4", "zstd", "multi-threaded-cf", "bindgen-runtime"] }

# Apache Arrow ecosystem
# IMPORTANT: arrow, arrow-schema and parquet MUST match the version used by DataFusion.
# DataFusion 55.0.0 resolves to Arrow 59.2.0; mixing Arrow families pulls a second
# arrow_array crate into the graph and causes FixedSizeListArray type mismatches.
# Upgrade DataFusion first before bumping Arrow/Parquet beyond this family.
arrow = { version = "59.2.0", default-features = false }
arrow-ipc = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0" }
datafusion = { version = "55.0.0", default-features = false, features = ["sql", "parquet", "recursive_protection", "nested_expressions"] }
datafusion-datasource = { version = "55.0.0", default-features = false }
datafusion-common = { version = "55.0.0", default-features = false }
datafusion-expr = { version = "55.0.0" }
datafusion-functions-json = { path = "vendor/datafusion-functions-json" }
sqlparser = { version = "0.62.0" }
parquet = { version = "59.2.0", default-features = false, features = ["snap", "zstd", "arrow", "async"] }

# Web framework
actix-web = { version = "4.15.0", features = ["http2"] }
actix-ws = "0.4.0"
actix-cors = "0.7.2"
actix-rt = "2.13.0"
actix-files = "0.7.0"
actix-multipart = "0.8.1"

# UUID generation
uuid = { version = "1.26.0", features = ["v4", "v7", "serde"] }

# NanoID generation (21-char URL-safe unique IDs)
nanoid = "0.5.0"

# ULID generation
ulid = "3.0.0"

# JWT authentication
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }

# Configuration
toml = "1.1.2"
dotenv = "0.15"

# CLI tools
clap = { version = "4.6.6", features = ["derive", "color"] }
console = { version = "0.16.4", default-features = false, features = ["unicode-width"] }
humantime = "2.4.0"
rustyline = { version = "18.0.1" }
shlex = "2.0.1"

# System
num_cpus = "1.16"
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
hostname = "0.4"

# Testing
tempfile = "3.27.0"
wait-timeout = "0.2"
serial_test = "3.5.0"
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["dex"] }

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports"] }

# Raft consensus
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
rmp = "0.8"
rmp-serde = "1.3"

# gRPC for Raft network layer
tonic = { version = "0.14.6" }
tonic-prost = "0.14.6"
tonic-build = "0.14.5"
prost = "0.14.4"
prost-types = "0.14.4"

# Additional dependencies
bcrypt = "0.19.3"
rand = "0.10.2"
rcgen = "0.14.10"
x509-parser = "0.18.1"
kalamdb-commons = { path = "backend/crates/kalamdb-commons", default-features = false }
kalamdb-serialization = { path = "backend/crates/kalamdb-serialization" }
kalamdb-observability = { path = "backend/crates/kalamdb-observability", default-features = false }
link-common = { path = "link/link-common", default-features = false }
kalam-client = { path = "link/sdks/rust", default-features = false }
kalamdb-row-filter = { path = "backend/crates/kalamdb-row-filter" }
kalamdb-transfer = { path = "backend/crates/kalamdb-transfer" }
kalamdb-plan-cache = { path = "backend/crates/kalamdb-plan-cache" }
kalamdb-backend = { path = "backend/crates/kalamdb-backend" }
kalamdb-postgres-wire = { path = "backend/crates/kalamdb-postgres-wire" }
kalamdb-tables = { path = "backend/crates/kalamdb-tables" }
kalamdb-rls = { path = "backend/crates/kalamdb-rls" }
kalamdb-views = { path = "backend/crates/kalamdb-views" }
kalamdb-datafusion-sources = { path = "backend/crates/kalamdb-datafusion-sources" }
kalamdb-functions = { path = "backend/crates/kalamdb-functions" }
cookie = "0.18.2"
colored = "3.1.1"
fern = "0.7"
indicatif = "0.18.6"
rpassword = "7.5.4"
dirs = "6.0"
term_size = "0.3"
crossterm = "0.29.0"
assert_cmd = "2.2.2"
