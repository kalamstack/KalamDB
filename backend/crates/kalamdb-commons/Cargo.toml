[package]
name = "kalamdb-commons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared types, constants, and utilities for KalamDB"
keywords = ["kalamdb", "database", "types"]
categories = ["database"]

[dependencies]
# workspace deps
once_cell = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
datafusion-common = { workspace = true, optional = true, default-features = false }
dashmap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
storekey = { workspace = true, optional = true }
kalamdb-observability = { workspace = true, default-features = false, optional = true }
# Optional dependencies - only enabled via features
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
rmp = { workspace = true, optional = true }
nanoid = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
# Feature to enable serde support for serialization
serde = [
	"dep:serde",
	"dep:serde_json",
	]
storage = ["dep:dashmap", "dep:parking_lot", "dep:storekey"]
arrow = [
	"serde",
	"dep:arrow",
	"dep:arrow-schema",
	]
scalar-values = [
	"arrow",
	"dep:datafusion-common",
	]
rows = ["scalar-values"]
schema-metadata = ["arrow"]
arrow-conversion = ["arrow"]
table-definition = [
	"schema-metadata",
	"arrow-conversion",
	"dep:chrono",
	]
conversions = [
	"rows",
	"schema-metadata",
	"dep:uuid",
	"dep:kalamdb-observability",
	]
serialization = ["rows", "conversions"]
arrow-utils = [
	"arrow",
	"rows",
	]
websocket-auth = ["serde"]
msgpack = ["serde", "dep:rmp", "dep:rmp-serde"]
traceability = ["dep:kalamdb-observability", "dep:tracing", "kalamdb-observability/traceability"]
# Full feature set including Arrow/DataFusion-backed utilities (for server use)
full = [
	"serde",
	"storage",
	"rows",
	"conversions",
	"serialization",
	"arrow-utils",
	"table-definition",
	"dep:chrono",
	"dep:uuid",
	"dep:nanoid",
	"dep:log",
 	"websocket-auth",
	"dep:datafusion-common",
	"msgpack",
]
# WASM-compatible subset (no datafusion but has serialization)
wasm = ["serde", "msgpack"]
default = ["full"]

[lib]
name = "kalamdb_commons"
path = "src/lib.rs"

[[bench]]
name = "snowflake_generator"
harness = false
required-features = ["storage"]
