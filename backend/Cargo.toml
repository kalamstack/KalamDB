[package]
name = "kalamdb-server"
version = { workspace = true }
edition = { workspace = true }
autobenches = false
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
default-run = "kalamdb-server"
build = "build.rs"

[dependencies]
# Memory optimization
mimalloc = { version = "0.1", default-features = false, optional = true }

# Core library
kalamdb-core = { path = "crates/kalamdb-core" }
kalamdb-live = { path = "crates/kalamdb-live" }
kalamdb-handlers = { path = "crates/kalamdb-handlers" }
kalamdb-jobs = { path = "crates/kalamdb-jobs" }
kalamdb-api = { path = "crates/kalamdb-api", default-features = false }
kalamdb-observability = { path = "crates/kalamdb-observability" }
kalamdb-store = { path = "crates/kalamdb-store" }
kalamdb-auth = { path = "crates/kalamdb-auth" }
kalamdb-commons = { path = "crates/kalamdb-commons" }
kalamdb-configs = { path = "crates/kalamdb-configs" }
kalamdb-system = { path = "crates/kalamdb-system" }
kalamdb-dba = { path = "crates/kalamdb-dba" }
kalamdb-postgres-wire = { path = "crates/kalamdb-postgres-wire" }
kalamdb-functions = { path = "crates/kalamdb-functions" }


# Password hashing
bcrypt = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Web framework
actix-web = { workspace = true }
actix-cors = { workspace = true }

# Concurrency / caching
moka = { workspace = true }
parking_lot = { workspace = true }

# Async futures utilities
futures-util = { workspace = true }

# Logging
log = { workspace = true }

# Tracing / observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-actix-web = { workspace = true }
tracing-log = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

# Time handling
chrono = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# System
num_cpus = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
# Dev builds use `embedded-ui` only for faster compile (no mimalloc C build or traceability).
# Production/release/docker builds pass explicit features — see docker/build and .github/workflows/release.yml.
default = ["embedded-ui"]
mimalloc = ["dep:mimalloc", "kalamdb-core/mimalloc", "kalamdb-observability/mimalloc"]
embedded-ui = ["kalamdb-api/embedded-ui"]
traceability = ["kalamdb-core/traceability", "kalamdb-observability/traceability"]
cloud-aws = ["kalamdb-core/cloud-aws"]
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
# End-to-end tests that require a full test server instance
e2e-tests = []

[lib]
name = "kalamdb_server"
path = "src/lib.rs"

[[bin]]
name = "kalamdb-server"
path = "src/main.rs"

[[test]]
name = "test_testserver"
path = "tests/testserver/test_testserver.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_scenarios"
path = "tests/scenarios/test_scenarios.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_scenarios_realtime"
path = "tests/scenarios/test_scenarios_realtime.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_scenarios_lifecycle"
path = "tests/scenarios/test_scenarios_lifecycle.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_scenarios_scale"
path = "tests/scenarios/test_scenarios_scale.rs"
required-features = ["e2e-tests"]

[[test]]
name = "endurance_test"
path = "tests/endurance_test.rs"
required-features = ["e2e-tests"]


[[test]]
name = "test_cluster"
path = "tests/cluster/test_cluster.rs"
required-features = ["e2e-tests"]

[[test]]
name = "test_misc"
path = "tests/misc/test_misc.rs"

[[test]]
name = "test_integration"
path = "tests/integration_tests/test_integration.rs"

[[test]]
name = "pgwire_catalog"
path = "tests/pgwire_catalog/test_client_catalog.rs"
required-features = ["e2e-tests"]

[build-dependencies]
chrono = { workspace = true }
cc = { workspace = true }

[dev-dependencies]
# Internal crates (needed for tests)
kalamdb-core = { path = "crates/kalamdb-core" }
kalamdb-api = { path = "crates/kalamdb-api", default-features = false }
kalamdb-auth = { path = "crates/kalamdb-auth" }
kalamdb-observability = { path = "crates/kalamdb-observability" }
kalamdb-store = { path = "crates/kalamdb-store" }
kalamdb-commons = { path = "crates/kalamdb-commons" }
kalamdb-configs = { path = "crates/kalamdb-configs" }
kalamdb-tables = { path = "crates/kalamdb-tables" }
kalamdb-rls = { workspace = true }
kalamdb-raft = { path = "crates/kalamdb-raft" }
kalamdb-dba = { path = "crates/kalamdb-dba" }
kalam-client = { path = "../link/sdks/rust", default-features = false, features = ["tokio-runtime", "cluster"] }

# External dependencies
tempfile = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
actix-web = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
datafusion = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
once_cell = { workspace = true }
serial_test = { workspace = true }
ntest = { workspace = true }
sha2 = { workspace = true }
testcontainers-modules = { workspace = true }
tokio-postgres = { workspace = true }
