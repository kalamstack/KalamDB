[package]
name = "kalam-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Interactive command-line client for KalamDB"
keywords = ["kalamdb", "database", "cli", "terminal"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "kalam"
path = "src/main.rs"

[dependencies]
# KalamDB connectivity
kalam-client = { path = "../link/sdks/rust", default-features = false, features = ["native-cli"] }
kalamdb-commons = { workspace = true, default-features = false, features = ["serde", "websocket-auth"] }
kalam-schema-diff = { path = "crates/kalam-schema-diff" }
kalamdb-sql = { package = "kalamdb-dialect", path = "../backend/crates/kalamdb-dialect" }

# CLI argument parsing
clap = { workspace = true }
console = { workspace = true }
humantime = { workspace = true }

# Readline interface
rustyline = { workspace = true }
shlex = { workspace = true }

# Progress indicators
indicatif = { workspace = true }

# Terminal colors and styling
colored = { workspace = true }

# Config file parsing
toml = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
openidconnect = { workspace = true }

# Secure password input
rpassword = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["process", "signal"] }
libc = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
handlebars = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Home directory detection
dirs = { workspace = true }

# Terminal dimensions
term_size = { workspace = true }

# Terminal control for interactive menus
crossterm = { workspace = true }

# Date/time formatting
chrono = { workspace = true }
rand.workspace = true
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

# Base64 encoding for history preservation
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ntest = { workspace = true }

[build-dependencies]
chrono = { workspace = true }
